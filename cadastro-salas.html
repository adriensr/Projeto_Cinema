</head>

<nav class="navbar navbar-expand-lg navbar-cinema">

<a class="navbar-brand" href="index.html">CINE<span style="color:#b3243b">CONTROL</span></a>
<button class="navbar-toggler" data-bs-target="#navMenu" data-bs-toggle="collapse" type="button">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto" id="navLinks">
<li class="nav-item"><a class="nav-link" data-view="home" href="index.html">Início</a></li>

<section class="view active" id="view-salas">
<div class="page-container">
<h1 class="page-title">Cadastro de Salas</h1>
<p class="page-subtitle">Adicione uma nova sala de exibição.</p>
<div class="form-panel">
<form id="formSala" novalidate="">
<div class="mb-3">
<label class="form-label" for="nomeSala">Nome da Sala</label>
<input class="form-control" id="nomeSala" placeholder="Ex: Sala 1" required="" type="text"/>
</div>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label" for="capacidade">Capacidade</label>
<input class="form-control" id="capacidade" min="1" required="" type="number"/>
</div>
<div class="col-md-6 mb-3">
<label class="form-label" for="tipoSala">Tipo</label>
<select class="form-select" id="tipoSala" required="">
<option disabled="" selected="" value="">Selecione</option>
<option value="2D">2D</option>
<option value="3D">3D</option>
<option value="IMAX">IMAX</option>
</select>
</div>
</div>
<button class="btn btn-crimson" type="submit">Salvar Sala</button>
<div class="status-msg" id="statusMsgSala"></div>
</form>
</div>
<h2 class="h5 mt-5 mb-3" style="color:var(--gold)">Salas cadastradas</h2>
<div id="listaSalas"></div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
