</head>

<section class="view active" id="view-filmes">
<div class="page-container">
<h1 class="page-title">Cadastro de Filmes</h1>
<p class="page-subtitle">Adicione um novo filme ao catálogo.</p>
<div class="form-panel">
<form id="formFilme" novalidate="">
<div class="mb-3">
<label class="form-label" for="titulo">Título</label>
<input class="form-control" id="titulo" required="" type="text"/>
</div>
<div class="mb-3">
<label class="form-label" for="capaFile">Capa do Filme</label>
<input accept="image/*" class="form-control" id="capaFile" type="file"/>
<div class="mt-2" id="capaPreviewWrapper" style="display:none;">
<img alt="Prévia da capa" id="capaPreview" src="" style="width:90px;border-radius:4px;border:1px solid var(--border);"/>
</div>
</div>
<div class="mb-3">
<label class="form-label" for="genero">Gênero</label>
<input class="form-control" id="genero" placeholder="Ex: Ação, Comédia, Drama" required="" type="text"/>
</div>
<div class="mb-3">
<label class="form-label" for="descricao">Descrição</label>
<textarea class="form-control" id="descricao" required="" rows="3"></textarea>
</div>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label" for="classificacao">Classificação Indicativa</label>
<select class="form-select" id="classificacao" required="">
<option disabled="" selected="" value="">Selecione</option>
<option value="Livre">Livre</option>
<option value="6">6 anos</option>
<option value="10">10 anos</option>
<option value="12">12 anos</option>
<option value="14">14 anos</option>
<option value="16">16 anos</option>
<option value="18">18 anos</option>
</select>
</div>
<div class="col-md-6 mb-3">
<label class="form-label" for="duracao">Duração (minutos)</label>
<input class="form-control" id="duracao" min="1" required="" type="number"/>
</div>
</div>
<div class="mb-3">
<label class="form-label" for="dataEstreia">Data de Estreia</label>
<input class="form-control" id="dataEstreia" required="" type="date"/>
</div>
<button class="btn btn-crimson" type="submit">Salvar Filme</button>
<div class="status-msg" id="statusMsgFilme"></div>
</form>
</div>
<h2 class="h5 mt-5 mb-3" style="color:var(--gold)">Filmes cadastrados</h2>
<div id="listaFilmes"></div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
