  <main class="container pb-5">
    <div class="card"><div class="card-body"><h2>Cadastro de Filmes</h2>
<form id="formFilme">
<div class="mb-3"><label class="form-label">Título</label><input id="titulo" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Gênero</label><input id="genero" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Descrição</label><textarea id="descricao" class="form-control" required></textarea></div>
<div class="mb-3"><label class="form-label">Classificação</label><select id="classificacao" class="form-select" required><option value="">Selecione</option><option>Livre</option><option>10</option><option>12</option><option>14</option><option>16</option><option>18</option></select></div>
<div class="mb-3"><label class="form-label">Duração (minutos)</label><input id="duracao" type="number" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Data de estreia</label><input id="estreia" type="date" class="form-control" required></div>
<button class="btn btn-primary" type="submit">Salvar</button>
</form></div></div>
  </main>
  <script src="script.js"></script>
  
</body>
