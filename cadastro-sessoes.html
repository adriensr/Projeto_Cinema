<html lang="pt-BR">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-cinema">
<div class="container">
<a class="navbar-brand" href="index.html">CINE<span style="color:#b3243b">CONTROL</span></a>
<button class="navbar-toggler" data-bs-target="#navMenu" data-bs-toggle="collapse" type="button">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto" id="navLinks">
<li class="nav-item"><a class="nav-link" data-view="home" href="index.html">Início</a></li>
<li class="nav-item"><a class="nav-link" data-view="filmes" href="cadastro-filmes.html">Filmes</a></li>
<li class="nav-item"><a class="nav-link" data-view="salas" href="cadastro-salas.html">Salas</a></li>
<li class="nav-item"><a class="nav-link active" data-view="cadastro-sessoes" href="cadastro-sessoes.html">Sessões</a></li>

</ul>

<section class="view active" id="view-cadastro-sessoes">
<div class="page-container">
<h1 class="page-title">Cadastro de Sessões</h1>
<p class="page-subtitle">Combine um filme e uma sala em um horário de exibição.</p>
<div class="form-panel">
<form id="formSessao" novalidate="">
<div class="mb-3">
<label class="form-label" for="filmeSelect">Filme</label>
<select class="form-select" id="filmeSelect" required="">
<option disabled="" selected="" value="">Selecione um filme</option>
</select>
</div>
<div class="mb-3">
<label class="form-label" for="salaSelect">Sala</label>
<select class="form-select" id="salaSelect" required="">
<option disabled="" selected="" value="">Selecione uma sala</option>
</select>
</div>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label" for="dataHora">Data e Hora</label>
<input class="form-control" id="dataHora" required="" type="datetime-local"/>
</div>
<div class="col-md-6 mb-3">
<label class="form-label" for="preco">Preço (R$)</label>
<input class="form-control" id="preco" min="0" required="" step="0.01" type="number"/>
</div>
</div>
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label" for="idioma">Idioma</label>
<select class="form-select" id="idioma" required="">
<option disabled="" selected="" value="">Selecione</option>
<option value="Dublado">Dublado</option>
<option value="Legendado">Legendado</option>
</select>
</div>
<div class="col-md-6 mb-3">
<label class="form-label" for="formato">Formato</label>
<select class="form-select" id="formato" required="">
<option disabled="" selected="" value="">Selecione</option>
<option value="2D">2D</option>
<option value="3D">3D</option>
</select>
</div>
</div>
<button class="btn btn-crimson" type="submit">Salvar Sessão</button>
<div class="status-msg" id="statusMsgSessao"></div>
</form>
</div>
<div class="mt-3" id="avisoVazioSessao"></div>
<h2 class="h5 mt-5 mb-3" style="color:var(--gold)">Sessões cadastradas</h2>
<div id="listaSessoes"></div>
</div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
