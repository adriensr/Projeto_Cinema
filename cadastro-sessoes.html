<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">

  <main class="container pb-5">
    <div class="card"><div class="card-body"><h2>Cadastro de Sessões</h2>
<form id="formSessao">
<div class="mb-3"><label class="form-label">Filme</label><select id="filmeSessao" class="form-select" required></select></div>
<div class="mb-3"><label class="form-label">Sala</label><select id="salaSessao" class="form-select" required></select></div>
<div class="mb-3"><label class="form-label">Data e hora</label><input id="dataHora" type="datetime-local" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Preço</label><input id="preco" type="number" step="0.01" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Idioma</label><select id="idioma" class="form-select" required><option>Dublado</option><option>Legendado</option></select></div>
<div class="mb-3"><label class="form-label">Formato</label><select id="formato" class="form-select" required><option>2D</option><option>3D</option></select></div>
<button class="btn btn-primary" type="submit">Salvar</button>
</form></div></div>
  </main>
  <script src="script.js"></script>
  
</body>
